[project]
name = "hrc-communication"
version = "0.1.0"
description = "HRC recognition/communication/decision-making/execution pipeline -- run_recognition.py's realtime YOLO+MotionBERT+LSTM step recognition, the standalone 3D posture debug tool (1_recognition/src/pose_detection_live.py), and the communication/decision-making/execution layers (0_core..4_execution)."
requires-python = ">=3.10,<3.11"
dependencies = [
    # -- 1_recognition: YOLO 2D pose + MotionBERT 3D lift + LSTM step recognition --
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8,<5.0",
    # Savitzky-Golay streaming features (1_recognition/skeleton3d_pipeline.py's
    # StreamingH36MFeatureExtractor / skeleton_pipeline/features/h36m_features.py).
    "scipy>=1.10",
    # norm_feat_rlt.py's progress bar.
    "tqdm>=4.65",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "ultralytics>=8.4,<9.0",
    "lap>=0.5",  # ultralytics multi-object tracking (ByteTrack/BoT-SORT) support
    # MotionBERT (pure PyTorch, see 1_recognition/src/skeleton_pipeline/motionbert_lifter.py)
    # -- same minimal inference-only subset as LSTM_HRC/data_proc_3d/app/pyproject.toml
    # (mmcv/mmpose/mmdet, tensorflow, depth_pro etc. deliberately NOT included -- this
    # pipeline doesn't need any of them, see that module's docstring).
    "tensorboardX>=2.5",
    "easydict>=1.10",
    "prettytable>=3.0",
    "imageio-ffmpeg>=0.4",
    "roma>=1.4",
    # setuptools>=81 dropped pkg_resources, which easydict/tensorboardX still import at
    # runtime -- pinned for the same reason LSTM_HRC/data_proc_3d/app/pyproject.toml is.
    "setuptools<81",
    # skeleton_pipeline/plotting (feature/label plots) + skeleton_pipeline/dataset/labels.py.
    "matplotlib>=3.7",
    "pandas>=2.0,<3.0",

    # -- 4_execution: UR robot arm (rtde_control/rtde_receive) + ROS bridge (roslibpy,
    # graceful no-op fallback if missing -- see ros_communication.py) --
    "ur-rtde>=1.6",
    "roslibpy>=2.1",

    # -- messaging / ML utilities used elsewhere in the project --
    "pika>=1.3",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Live iPhone capture (1_recognition/src/camera_utils/iphone_connection.py) -- only
# needed for --source iphone / VisionConfig.camera.video_source == "iphone".
iphone = ["record3d"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
