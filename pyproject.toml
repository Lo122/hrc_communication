[project]
name = "hrc-communication"
version = "0.1.0"
description = "HRC recognition/communication/decision-making/execution pipeline -- run_recognition.py's realtime YOLO+MotionBERT+LSTM step recognition, the standalone 3D posture debug tool (1_recognition/eval/pose_detection_live.py), and the communication/decision-making/execution layers (0_core..4_execution)."
requires-python = ">=3.10,<3.11"
dependencies = [
    # -- 1_recognition: YOLO 2D pose + MotionBERT 3D lift + LSTM step recognition --
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8,<5.0",
    # Savitzky-Golay streaming features (1_recognition/src/skeleton3d_pipeline.py's
    # StreamingH36MFeatureExtractor / feature_utils/h36m_features.py).
    "scipy>=1.10",
    # feature_normalizer.py's progress bar.
    "tqdm>=4.65",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "ultralytics>=8.4,<9.0",
    "lap>=0.5",  # ultralytics multi-object tracking (ByteTrack/BoT-SORT) support
    # MotionBERT (pure PyTorch, see 1_recognition/src/skeleton_utils/motionbert_lifter.py)
    # -- same minimal inference-only subset as LSTM_HRC/data_proc_3d/app/pyproject.toml
    # (mmcv/mmpose/mmdet, tensorflow, depth_pro etc. deliberately NOT included -- this
    # pipeline doesn't need any of them, see that module's docstring).
    "tensorboardX>=2.5",
    "easydict>=1.10",
    "prettytable>=3.0",
    "imageio-ffmpeg>=0.4",
    "roma>=1.4",
    # setuptools>=81 dropped pkg_resources, which easydict/tensorboardX still import at
    # runtime -- pinned for the same reason LSTM_HRC/data_proc_3d/app/pyproject.toml is.
    "setuptools<81",
    # skeleton_utils/plotting (feature/label plots) + skeleton_utils/dataset/labels.py.
    "matplotlib>=3.7",
    "pandas>=2.0,<3.0",
    # Live iPhone capture (1_recognition/src/camera_utils/iphone_connection.py,
    # --iphone / VisionConfig.camera.video_source == "iphone"). A regular dependency
    # rather than an extra: a plain `uv sync` removes extras that are not requested.
    "record3d>=1.4",
    # -- 4_execution: UR robot arm (rtde_control/rtde_receive) + ROS bridge (roslibpy,
    # graceful no-op fallback if missing -- see ros_communication.py) --
    "ur-rtde>=1.6",
    # <2.0 because multi-actor-interface requires it. This project only uses Ros/Topic/
    # Message (run, terminate, is_connected, advertise, publish, subscribe), all in 1.x.
    "roslibpy>=1.8,<2.0",
    # ROS robot control library, a sibling checkout (see [tool.uv.sources]). It ships a
    # top-level `config` package, so scripts must put this repo's root FIRST on
    # sys.path (insert(0, ...)) or `import config` picks up that package instead.
    "multi-actor-interface",
    # -- Interface/ (web UI, Interface/requirements.txt) --
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # -- messaging / ML utilities used elsewhere in the project --
    "pika>=1.3",
    "scikit-learn>=1.5",
    "vosk>=0.3.45",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.6",
    "websocket-client>=1.9.1",
    "dotenv>=0.9.9",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# Not editable: an editable install is a .pth file holding the library's path, which
# Python 3.10 reads in the Windows code page -- the "ä" in "Universität" (written as
# UTF-8) then decodes wrong and the path is silently dropped, so `import core` fails.
# After changing the library, pick the changes up with:
#     uv sync --reinstall-package multi-actor-interface
multi-actor-interface = { path = "../Multi-Actor-Interface-Library" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]
# Copy instead of hardlinking out of the uv cache: OneDrive's cloud-files filter
# (cldflt) attaches to all of C: and intermittently rejects hardlink creation with
# os error 396, ERROR_CLOUD_FILE_INCOMPATIBLE_HARDLINKS. Wheels with many small
# files (pytz's zoneinfo tree) trip it most often.
link-mode = "copy"
# The environment itself lives OUTSIDE OneDrive, at C:\uv-venvs\hrc_communication:
# uv has no pyproject setting for that, so UV_PROJECT_ENVIRONMENT is set per workspace
# in .vscode/settings.json (terminal.integrated.env.windows). Never set it user-wide --
# LSTM_HRC uses a different torch build and needs its own environment.
